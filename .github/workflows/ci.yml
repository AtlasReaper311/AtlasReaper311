name: Pull request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Must run on automation/profile-readme-refresh-* PRs. Skipping those jobs
  # leaves the workflow as action_required, so the ruleset-required check
  # "Profile README validation" never lands on the PR and merge stays blocked.
  profile-validation:
    name: Profile README validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24

      - name: Compile the updater
        run: python3 -m py_compile scripts/update_readme.py

      - name: Run updater unit tests
        run: python3 -m unittest tests/test_update_readme.py

      - name: Validate deterministic sample and README markers
        run: |
          set -eu
          python3 scripts/update_readme.py --sample > "$RUNNER_TEMP/live-block.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          sample = (Path(os.environ["RUNNER_TEMP"]) / "live-block.txt").read_text(encoding="utf-8")
          start = "<!-- ATLAS:LIVE:START -->"
          end = "<!-- ATLAS:LIVE:END -->"
          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit("README must contain exactly one ordered Atlas live marker pair")
          if readme.index(start) >= readme.index(end):
              raise SystemExit("Atlas live markers are reversed")
          if sample.count(start) != 1 or sample.count(end) != 1:
              raise SystemExit("sample output does not contain one Atlas live marker pair")
          if "[writing]  W-07 · Atlas Lab" not in sample:
              raise SystemExit("sample output did not select the latest published Writing card")
          if "[estate]   33 governed public repos" not in sample:
              raise SystemExit("sample output did not use the Atlas Infra projection count")
          if "[activity]" in sample:
              raise SystemExit("sample output must not present aggregate commit volume as profile activity")
          PY
