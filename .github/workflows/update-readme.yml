# Refresh the governed live block in the profile README.
#
# The scheduled job never writes main directly. A genuine content change is
# committed to a one-use automation branch, validated on that exact head,
# merged through a pull request, and then the branch is deleted.
#
# The repository-local GITHUB_TOKEN is sufficient. No PAT or bypass actor is
# required. Pull requests authored by github-actions[bot] leave sibling
# pull_request workflows in action_required until approved; this job approves
# those exact-head runs, waits for mergeStateStatus=CLEAN under the ruleset
# (required check: Profile README validation), then squash-merges.
# workflow_dispatch remains a belt-and-suspenders exact-head validation path.

name: update-readme

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
        with:
          fetch-depth: 0

      - name: Regenerate governed live block
        run: python3 scripts/update_readme.py

      - name: Detect genuine change
        id: diff
        run: |
          set -eu
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no genuine change; skipping pull request"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated README on one-use branch
        if: steps.diff.outputs.changed == 'true'
        id: branch
        run: |
          set -eu
          BRANCH="automation/profile-readme-refresh-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh governed live block"
          git push --set-upstream origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -eu
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh governed profile evidence" \
            --body "Automated six-hour profile refresh. The branch contains only the generated README live block. It must pass exact-head profile validation before merge.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head profile validation
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -eu
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Wait for ruleset-ready profile validation
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD_SHA: ${{ steps.branch.outputs.sha }}
        run: |
          set -eu
          ATTEMPT=0
          while [ "$ATTEMPT" -lt 60 ]
          do
            # Bot-authored PRs park pull_request workflows as action_required until
            # approved. Approve exact-head runs so the ruleset-required check can land.
            PENDING_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&status=action_required&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${HEAD_SHA}\") | .id] | .[]")"
            for RUN_ID in $PENDING_IDS
            do
              echo "Approving exact-head workflow run ${RUN_ID}"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve" >/dev/null || true
            done

            MERGE_STATE="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
            CHECK="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Profile README validation")] | sort_by(.completed_at // .started_at) | reverse | .[0].conclusion // "missing"')"
            echo "attempt=${ATTEMPT} mergeStateStatus=${MERGE_STATE} profile_check=${CHECK}"
            if [ "$CHECK" = "failure" ] || [ "$CHECK" = "cancelled" ] || [ "$CHECK" = "timed_out" ]; then
              echo "::error::Profile README validation concluded ${CHECK}."
              exit 1
            fi
            if [ "$MERGE_STATE" = "CLEAN" ] && [ "$CHECK" = "success" ]; then
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done
          echo "::error::Timed out waiting for Profile README validation and CLEAN merge state on ${PR_URL}."
          gh pr view "$PR_URL" --json number,url,mergeStateStatus,statusCheckRollup
          gh run list --workflow ci.yml --branch "$BRANCH" --limit 10
          exit 1

      - name: Merge validated exact head
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD_SHA: ${{ steps.branch.outputs.sha }}
        run: |
          set -eu
          gh pr merge "$PR_URL" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"
